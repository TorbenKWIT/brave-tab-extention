<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Custom New Tab – Options</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 520px; margin: 40px auto; padding: 0 16px; }
    input { width: 100%; padding: 8px; font-size: 14px; box-sizing: border-box; }
    button { margin-top: 12px; padding: 8px 16px; font-size: 14px; cursor: pointer; }
    #status { margin-left: 10px; color: green; }
  </style>
</head>
<body>
  <h1>Custom New Tab</h1>
  <label for="url">Website to open in new tabs:</label>
  <input id="url" type="url" placeholder="https://example.com">
  <button id="save">Save</button><span id="status"></span>
  <script src="defaults.js"></script>
  <script src="options.js"></script>
</body>
</html>
